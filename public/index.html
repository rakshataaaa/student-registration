<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Portal</h1>
            <p>Register and manage student records effortlessly</p>
        </header>

        <main>
            <!-- Registration / Edit Form Card -->
            <section class="card form-card">
                <h2 id="form-title">Register New Student</h2>
                <form id="student-form">
                    <input type="hidden" id="student-id">
                    
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="Enter full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="Enter email address">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" required placeholder="Enter phone number">
                    </div>

                    <div class="form-group">
                        <label for="course">Course</label>
                        <input type="text" id="course" required placeholder="Enter course name">
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn primary-btn">Register Student</button>
                        <button type="button" id="cancel-btn" class="btn secondary-btn" style="display: none;">Cancel</button>
                    </div>
                </form>
                <div id="form-message" class="message"></div>
            </section>

            <!-- Student List Section -->
            <section class="card list-card">
                <h2>Registered Students</h2>
                <div class="table-responsive">
                    <table id="students-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Course</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-tbody">
                            <!-- Dynamic rows will be inserted here -->
                            <tr>
                                <td colspan="6" class="loading-text">Loading students...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
